# The original example, kept for backwards compatibility.
#
# Superseded by the files alongside it:
#
#   minimal.yml          start here
#   nodejs-library.yml   a published npm package
#   custom-scaffold.yml  custom.files and custom.folders
#
# See README.md for the full set.
version: 1

project:
  type: nodejs

rules:
  readme: error
  license: warning
  gitignore: warning
  changelog: info
  package_manager: error

  src_folder: warning
  tests_folder: error
  docs_folder: info
  scripts_folder: info

  adr: info
  contributing: info
  api_docs: warning
  security: info
  code_of_conduct: info
  pull_request_template: info
  issue_templates: info

  ci_config: info

  pre_commit: info
  editorconfig: info
  code_owners: info

  dockerfile: info
  dockerignore: info
  docker_compose: info

custom:
  files:
    - path: ".env.example"
      content: |
        # Application
        NODE_ENV=development
        PORT=3000

        # Database
        DATABASE_URL=postgresql://user:password@localhost:5432/mydb

        # API Keys
        API_KEY=your_api_key_here
        API_SECRET=your_api_secret_here

  folders:
    - path: "src/api"
      structure:
        controllers: {}
        middlewares: {}
        routes: {}
        validators: {}