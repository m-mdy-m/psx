# GitHub Actions templates, reusable and generic.
#
# Each entry is a standalone workflow file. Templates are split by concern so a
# project composes only what it needs:
#
#   ci_*                     continuous integration
#   release_*                tag-driven releases
#   docker_*                 image builds and Docker Hub publishing
#   deploy_*                 hosting and publishing
#   codeql / security        scanning
#
# Variables available to every template: "{{project_name}}, {{repo_name}},"
# {{github_username}}, {{domain}}, {{docker_image}}, {{main_branch}}.
#
# Keep each workflow independently runnable: a project should be able to copy a
# single file and have it work, without depending on another file existing.

# ===========================================================================
# Continuous integration
# ===========================================================================

ci_go: |
  name: CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            # Full history so `git describe` can produce a version.
            fetch-depth: 0

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: stable
            cache: true

        - name: Vet
          run: go vet ./...

        - name: Test
          run: go test -race -coverprofile=coverage.out ./...

        - name: Verify formatting
          run: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "::error::These files need gofmt:"
              echo "$unformatted"
              exit 1
            fi

        - name: Upload coverage
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: coverage
            path: coverage.out
            retention-days: 7
            if-no-files-found: ignore

ci_nodejs: |
  name: CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
            version: 11

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: pnpm

        - name: Install dependencies
          # A frozen lockfile makes the build reproducible, and fails loudly
          # when the lockfile and manifest disagree.
          run: pnpm install --frozen-lockfile

        - name: Lint
          run: pnpm lint

        - name: Typecheck
          run: pnpm typecheck

        - name: Test
          run: pnpm test

        - name: Build
          run: pnpm build

ci_rust: |
  name: CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Install toolchain
          run: |
            rustup toolchain install stable --profile minimal --component clippy,rustfmt
            rustup default stable

        - name: Cache cargo
          uses: Swatinem/rust-cache@v2

        - name: Format
          run: cargo fmt --all -- --check

        - name: Clippy
          run: cargo clippy --all-targets --all-features -- -D warnings

        - name: Test
          run: cargo test --all-features

ci_python: |
  name: CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: Check
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.12'
            cache: pip

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install ruff pytest pytest-cov

        - name: Lint
          run: ruff check .

        - name: Format check
          run: ruff format --check .

        - name: Test
          run: pytest --cov --cov-report=xml

        - name: Upload coverage
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: coverage
            path: coverage.xml
            retention-days: 7
            if-no-files-found: ignore

ci_monorepo: |
  name: CI

  on:
    push:
      branches: [main]
    pull_request:
      branches: [main]

  permissions:
      contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: Check all packages
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup pnpm
          uses: pnpm/action-setup@v6
          with:
            version: 11

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: pnpm

        - name: Install dependencies
          run: pnpm install --frozen-lockfile

        # --recursive covers every workspace member, so a broken package cannot
        # pass just because the root scripts do not exercise it.
        - name: Lint
          run: pnpm -r lint

        - name: Typecheck
          run: pnpm -r typecheck

        - name: Test
          run: pnpm -r test

        - name: Build
          run: pnpm -r build

# ===========================================================================
# Releases
# ===========================================================================

release_go: |
  name: Release

  on:
    push:
      tags: ['v*.*.*']
    workflow_dispatch: {}

  permissions:
    contents: write

  concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    build:
      name: Build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: stable

        - name: Test
          run: go test -race ./...

        - name: Build
          run: |
            mkdir -p dist
            go build -trimpath -ldflags "-s -w" \
              -o "dist/{{project_name}}" ./cmd/{{project_name}}

        - name: Checksum
          run: cd dist && sha256sum * > checksums.txt

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: release
            path: dist/*
            retention-days: 1

    create-release:
      name: Publish GitHub Release
      needs: [build]
      if: always() && startsWith(github.ref, 'refs/tags/')
      runs-on: ubuntu-latest

      steps:
        - name: Download artifacts
          uses: actions/download-artifact@v4
          with:
            path: artifacts
            pattern: release
            merge-multiple: true

        - name: Collect assets
          run: |
            mkdir -p release
            if [[ -d artifacts ]]; then
              find artifacts -type f -exec cp {} release/ \;
            fi
            ls -lh release/ || echo "(no assets)"

        - name: Extract version
          id: version
          run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

        - name: Build release notes
          run: |
            VERSION="${{ steps.version.outputs.VERSION }}"

            # Prefer the matching CHANGELOG section so the notes stay in one
            # place; fall back to a generated summary.
            if [[ -f CHANGELOG.md ]] && grep -q "## \[${VERSION}\]" CHANGELOG.md; then
              sed -n "/## \[${VERSION}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_body.md
            else
              printf '## Release %s\n\nSee [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
                "${{ github.ref_name }}" "${{ github.repository }}" > release_body.md
            fi

        - name: Create release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ github.ref_name }}
            name: '{{project_name}} ${{ github.ref_name }}'
            body_path: release_body.md
            files: release/*
            draft: false
            prerelease: false
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

release_linux: |
  name: Release – Linux

  on:
    push:
      tags: ['v*.*.*']
    workflow_dispatch: {}
    workflow_call:
      outputs:
        artifact-name:
          description: "Name of the uploaded artifact"
          value: ${{ jobs.build-linux.outputs.artifact-name }}

  permissions:
    contents: read

  concurrency:
    group: release-linux-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    build-linux:
      name: Build (Linux x86_64)
      runs-on: ubuntu-22.04
      outputs:
        artifact-name: "{{project_name}}-linux-x86_64"

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: stable

        - name: Cache build
          uses: actions/cache@v4
          with:
            path: |
              ~/.cache/go-build
              ~/go/pkg/mod
            key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
            restore-keys: go-${{ runner.os }}-

        - name: Build
          run: |
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
              go build -trimpath -ldflags "-s -w" \
              -o "{{project_name}}-linux-x86_64" ./cmd/{{project_name}}

        - name: Package tarball
          run: |
            VERSION="${{ github.ref_name }}"
            PKG="{{project_name}}-${VERSION}-linux-x86_64"
            mkdir -p "dist/${PKG}"
            cp "{{project_name}}-linux-x86_64" "dist/${PKG}/"
            cp README.md LICENSE "dist/${PKG}/" 2>/dev/null || true
            tar czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
            rm -rf "dist/${PKG}"

        - name: Checksum
          run: cd dist && sha256sum *.tar.gz > checksums.txt

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: "{{project_name}}-linux-x86_64"
            path: dist/*
            retention-days: 1

release_windows: |
  name: Release – Windows

  on:
    push:
      tags: ['v*.*.*']
    workflow_dispatch: {}
    workflow_call:
      outputs:
        artifact-name:
          description: "Name of the uploaded artifact"
          value: ${{ jobs.build-windows.outputs.artifact-name }}

  permissions:
    contents: read

  concurrency:
    group: release-windows-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    build-windows:
      name: Build (Windows x86_64)
      runs-on: windows-2022
      outputs:
        artifact-name: "{{project_name}}-windows-x86_64"

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: stable

        - name: Build
          shell: bash
          run: |
            CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
              go build -trimpath -ldflags "-s -w" \
              -o "{{project_name}}.exe" ./cmd/{{project_name}}

        # PowerShell keeps the paths native, which Compress-Archive expects.
        - name: Package zip
          shell: pwsh
          run: |
            $version = "${{ github.ref_name }}"
            $pkg = "{{project_name}}-$version-windows-x86_64"
            $stage = "dist/$pkg"

            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            Copy-Item "{{project_name}}.exe" $stage

            foreach ($f in @("README.md", "LICENSE")) {
              if (Test-Path $f) { Copy-Item $f $stage }
            }

            Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"

        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: "{{project_name}}-windows-x86_64"
            path: dist/*
            retention-days: 1

release_macos: |
  name: Release – macOS

  on:
    push:
      tags: ['v*.*.*']
    workflow_dispatch: {}
    workflow_call:
