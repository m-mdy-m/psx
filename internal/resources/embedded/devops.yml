# DevOps Templates and Configurations

# Docker
docker:
  generic:
    dockerfile: |
      # Build stage
      FROM alpine:latest

      WORKDIR /app

      # Copy your application files
      COPY . .

      # Install dependencies and build if needed
      # RUN your-build-commands

      EXPOSE 8080

      CMD ["sh", "-c", "echo 'Configure your application start command'"]

    dockerignore: |
      # Version control
      .git/
      .gitignore
      .gitattributes

      # CI/CD
      .github/
      .gitlab-ci.yml
      .travis.yml

      # IDE
      .vscode/
      .idea/
      *.swp
      *.swo

      # OS
      .DS_Store
      Thumbs.db

      # Build artifacts
      build/
      dist/
      *.exe

      # Docs
      docs/
      *.md
      !README.md

      # Tests
      tests/
      test/
      **/*_test.*
      **/*.test.*

      # Misc
      .env*
      !.env.example

  nodejs:
    dockerfile: |
      # Build stage
      FROM node:18-alpine AS builder

      WORKDIR /app

      # Copy package files
      COPY package*.json ./

      # Install dependencies
      RUN npm ci --only=production

      # Copy source code
      COPY . .

      # Build application
      RUN npm run build

      # Production stage
      FROM node:18-alpine

      WORKDIR /app

      # Copy from builder
      COPY --from=builder /app/dist ./dist
      COPY --from=builder /app/node_modules ./node_modules
      COPY --from=builder /app/package.json ./

      # Create non-root user
      RUN addgroup -g 1001 -S nodejs && \
          adduser -S nodejs -u 1001

      USER nodejs

      EXPOSE 3000

      CMD ["node", "dist/index.js"]

    dockerignore: |
      # Dependencies
      node_modules/
      npm-debug.log*
      yarn-error.log*
      pnpm-debug.log*

      # Build
      dist/
      build/
      .next/

      # Environment
      .env*
      !.env.example

      # Git
      .git/
      .gitignore

      # IDE
      .vscode/
      .idea/

      # Testing
      coverage/
      .nyc_output/
      test/
      tests/
      **/*.test.js
      **/*.test.ts

      # Misc
      *.md
      !README.md
      .DS_Store

  go:
    dockerfile: |
      # Build stage
      FROM golang:1.21-alpine AS builder

      WORKDIR /app

      # Copy go mod files
      COPY go.mod go.sum ./
      RUN go mod download

      # Copy source code
      COPY . .

      # Build
      RUN CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o main ./cmd/app

      # Production stage
      FROM alpine:latest

      RUN apk --no-cache add ca-certificates

      WORKDIR /root/

      # Copy binary from builder
      COPY --from=builder /app/main .

      EXPOSE 8080

      CMD ["./main"]

    dockerignore: |
      # Build
      build/
      *.exe
      *.test
      *.out

      # Dependencies
      vendor/

      # Git
      .git/
      .gitignore

      # IDE
      .vscode/
      .idea/

      # Testing
      coverage.txt
      coverage.html
      **/*_test.go

      # Misc
      *.md
      !README.md
      .DS_Store

# Docker Compose
docker_compose:
  basic: |
    version: '3.8'

    services:
      app:
        build:
          context: .
          dockerfile: Dockerfile
        ports:
          - "3000:3000"
        environment:
          - NODE_ENV=production
        restart: unless-stopped

  with_db: |
    version: '3.8'

    services:
      app:
        build:
          context: .
          dockerfile: Dockerfile
        ports:
          - "3000:3000"
        environment:
          - NODE_ENV=production
          - DATABASE_URL=postgresql://user:password@db:5432/mydb
        depends_on:
          - db
        restart: unless-stopped

      db:
        image: postgres:15-alpine
        environment:
          - POSTGRES_USER=user
          - POSTGRES_PASSWORD=password
          - POSTGRES_DB=mydb
        volumes:
          - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped

    volumes:
      postgres_data:

cicd:
  github_actions:
    nodejs: |
      name: CI/CD

      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]

      jobs:
        test:
          runs-on: ubuntu-latest

          strategy:
            matrix:
              node-version: [16.x, 18.x, 20.x]

          steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                node-version: ${{ matrix.node-version }}
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

        deploy:
          needs: test
          runs-on: ubuntu-latest
          if: github.ref == 'refs/heads/main'

          steps:
            - uses: actions/checkout@v4

            - name: Deploy
              run: echo "Add your deployment steps here"

    go: |
      name: CI/CD

      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]

      jobs:
        test:
          runs-on: ubuntu-latest

          strategy:
            matrix:
              go-version: [1.21.x, 1.22.x]

          steps:
            - uses: actions/checkout@v4

            - name: Setup Go ${{ matrix.go-version }}
              uses: actions/setup-go@v4
              with:
                go-version: ${{ matrix.go-version }}

            - name: Install dependencies
              run: go mod download

            - name: Run tests
              run: go test -v -race ./...

            - name: Run linter
              uses: golangci/golangci-lint-action@v3
              with:
                version: latest

            - name: Build
              run: go build -v ./...

        deploy:
          needs: test
          runs-on: ubuntu-latest
          if: github.ref == 'refs/heads/main'

          steps:
            - uses: actions/checkout@v4

            - name: Deploy
              run: echo "Add your deployment steps here"

    generic: |
      name: CI/CD

      on:
        push:
          branches: [main, develop]
        pull_request:
          branches: [main]

      jobs:
        test:
          runs-on: ubuntu-latest

          steps:
            - uses: actions/checkout@v4

            - name: Run tests
              run: echo "Add your test commands here"

            - name: Build
              run: echo "Add your build commands here"

        deploy:
          needs: test
          runs-on: ubuntu-latest
          if: github.ref == 'refs/heads/main'

          steps:
            - uses: actions/checkout@v4

            - name: Deploy
              run: echo "Add your deployment steps here"

  gitlab_ci:
    nodejs: |
      stages:
        - test
        - build
        - deploy

      variables:
        NODE_VERSION: "18"

      cache:
        paths:
          - node_modules/

      test:
        stage: test
        image: node:${NODE_VERSION}
        script:
          - npm ci
          - npm run lint
          - npm test
        only:
          - merge_requests
          - main
          - develop

      build:
        stage: build
        image: node:${NODE_VERSION}
        script:
          - npm ci
          - npm run build
        artifacts:
          paths:
            - dist/
        only:
          - main
          - develop

      deploy:
        stage: deploy
        script:
          - echo "Add your deployment steps here"
        only:
          - main
        when: manual

    go: |
      stages:
        - test
        - build
        - deploy

      variables:
        GO_VERSION: "1.21"

      cache:
        paths:
          - .cache

      test:
        stage: test
        image: golang:${GO_VERSION}
        script:
          - go mod download
          - go test -v -race ./...
          - go vet ./...
        only:
          - merge_requests
          - main
          - develop

      build:
        stage: build
        image: golang:${GO_VERSION}
        script:
          - go mod download
          - go build -v ./...
        artifacts:
          paths:
            - build/
        only:
          - main
          - develop

      deploy:
        stage: deploy
        script:
          - echo "Add your deployment steps here"
        only:
          - main
        when: manual

    generic: |
      stages:
        - test
        - build
        - deploy

      test:
        stage: test
        script:
          - echo "Add your test commands here"
        only:
          - merge_requests
          - main
          - develop

      build:
        stage: build
        script:
          - echo "Add your build commands here"
        only:
          - main
          - develop

      deploy:
        stage: deploy
        script:
          - echo "Add your deployment steps here"
        only:
          - main
        when: manual# Dependency Updates (Dependabot)

dependabot:
  generic: |
    version: 2
    updates:
      # Dependabot reads the ecosystems present in the repo; adjust the list to
      # match what this project actually uses.
      - package-ecosystem: "github-actions"
        directory: "/"
        schedule:
          interval: "weekly"
        groups:
          actions:
            patterns: ["*"]

  nodejs: |
    version: 2
    updates:
      - package-ecosystem: "npm"
        directory: "/"
        schedule:
          interval: "weekly"
        groups:
          prod:
            dependency-type: "production"
            update-types: ["minor", "patch"]
          dev:
            dependency-type: "development"
      - package-ecosystem: "github-actions"
        directory: "/"
        schedule:
          interval: "weekly"
      - package-ecosystem: "docker"
        directory: "/"
        schedule:
          interval: "weekly"

  go: |
    version: 2
    updates:
      - package-ecosystem: "gomod"
        directory: "/"
        schedule:
          interval: "weekly"
        groups:
          go-minor-patch:
            update-types: ["minor", "patch"]
      - package-ecosystem: "github-actions"
        directory: "/"
        schedule:
          interval: "weekly"
      - package-ecosystem: "docker"
        directory: "/"
        schedule:
          interval: "weekly"

# Renovate, as an alternative to Dependabot
renovate:
  generic: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": ["config:recommended", ":semanticCommits"],
      "schedule": ["before 5am on monday"]
    }

  nodejs: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": ["config:recommended", ":semanticCommits", ":groupPatchableNonMajor"],
      "npm": { "enabled": true },
      "schedule": ["before 5am on monday"]
    }

  go: |
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": ["config:recommended", ":semanticCommits"],
      "enabledManagers": ["gomod", "github-actions", "dockerfile"],
      "schedule": ["before 5am on monday"]
    }

# Node runtime pinning
node_version:
  nodejs: |
    22

# Release pipeline (tag-triggered)
release_workflow:
  generic: |
    name: Release

    on:
      push:
        tags: ["v*"]

    permissions:
      contents: write

    jobs:
      release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - uses: actions/setup-go@v5
            with:
              go-version: stable

          - name: Run tests
            run: go test -race ./...

          - name: Build binaries
            run: go build -trimpath -ldflags "-s -w" -o dist/{{project_name}} ./cmd/{{project_name}}

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              generate_release_notes: true
              files: dist/*

  nodejs: |
    name: Release

    on:
      push:
        tags: ["v*"]

    permissions:
      contents: write
      id-token: write

    jobs:
      release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - uses: actions/setup-node@v4
            with:
              node-version: 22
              registry-url: https://registry.npmjs.org

          - run: npm ci
          - run: npm test

          - name: Publish to npm
            run: npm publish --provenance
            env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go: |
    name: Release

    on:
      push:
        tags: ["v*"]

    permissions:
      contents: write

    jobs:
      release:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              fetch-depth: 0

          - uses: actions/setup-go@v5
            with:
              go-version: stable

          - name: Verify
            run: |
              go vet ./...
              go test -race -coverprofile=coverage.out ./...

          - name: Build matrix
            run: |
              mkdir -p dist
              for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
                os="${target%/*}"; arch="${target#*/}"
                ext=""
                [ "$os" = "windows" ] && ext=".exe"
                CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -trimpath -ldflags "-s -w" \
                  -o "dist/{{project_name}}_${os}_${arch}${ext}" ./cmd/{{project_name}}
              done

          - name: Checksums
            run: cd dist && sha256sum * > checksums.txt

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              generate_release_notes: true
              files: dist/*

# Reverse proxy configuration
nginx:
  generic: |
    # {{project_name}} reverse proxy
    server {
        listen 80;
        server_name {{domain}};

        # Redirect to HTTPS in production; adjust or remove for local use.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name {{domain}};

        ssl_certificate     /etc/letsencrypt/live/{{domain}}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/{{domain}}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        client_max_body_size 10m;

        location / {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://app:8080/health;
            access_log off;
        }

        # Static assets can be cached aggressively.
        location ~* \.(js|css|woff2|png|jpg|svg)$ {
            proxy_pass http://app:8080;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

  nodejs: |
    # {{project_name}} reverse proxy (Node.js)
    server {
        listen 80;
        server_name {{domain}};

        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

# Kubernetes manifests
kubernetes:
  generic: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{project_name}}
      labels:
        app.kubernetes.io/name: {{project_name}}
    spec:
      replicas: 2
      selector:
        matchLabels:
          app.kubernetes.io/name: {{project_name}}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{project_name}}
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: {{project_name}}
              image: {{docker_image}}:latest
              ports:
                - name: http
                  containerPort: 8080
              envFrom:
                - secretRef:
                    name: {{project_name}}-secrets
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 10
                periodSeconds: 15
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 5
                periodSeconds: 10
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: {{project_name}}
    spec:
      selector:
        app.kubernetes.io/name: {{project_name}}
      ports:
        - name: http
          port: 80
          targetPort: http

  nodejs: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{project_name}}
      labels:
        app.kubernetes.io/name: {{project_name}}
    spec:
      replicas: 2
      selector:
        matchLabels:
          app.kubernetes.io/name: {{project_name}}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{project_name}}
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          containers:
            - name: {{project_name}}
              image: {{docker_image}}:latest
              ports:
                - name: http
                  containerPort: 3000
              envFrom:
                - secretRef:
                    name: {{project_name}}-secrets
              livenessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: http
                initialDelaySeconds: 5
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: {{project_name}}
    spec:
      selector:
        app.kubernetes.io/name: {{project_name}}
      ports:
        - name: http
          port: 80
          targetPort: http

# Helm chart scaffold
helm_chart:
  generic: |
    apiVersion: v2
    name: {{repo_name}}
    description: {{project_desc}}
    type: application
    version: 0.1.0
    appVersion: "0.1.0"

    values: |
      replicaCount: 2

      image:
        repository: {{docker_image}}
        pullPolicy: IfNotPresent
        tag: ""

      service:
        type: ClusterIP
        port: 80

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

  nodejs: |
    apiVersion: v2
    name: {{repo_name}}
    description: {{project_desc}}
    type: application
    version: 0.1.0
    appVersion: "0.1.0"

    values: |
      replicaCount: 2

      image:
        repository: {{docker_image}}
        pullPolicy: IfNotPresent
        tag: ""

      service:
        type: ClusterIP
        port: 80

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
