# Documentation Templates

# Security
security: |
  # Security Policy

  ## Supported Versions

  We release patches for security vulnerabilities. Which versions are eligible for
  receiving such patches depends on the CVSS v3.0 Rating:

  | Version | Supported          |
  | ------- | ------------------ |
  | 1.x.x   | :white_check_mark: |
  | < 1.0   | :x:                |

  ## Reporting a Vulnerability

  Please report security vulnerabilities to: {{email}}

  **Please do not report security vulnerabilities through public GitHub issues.**

  You should receive a response within 48 hours. If for some reason you do not, please follow up to ensure we received your original message.

  Please include the following information in your report:

  - Type of issue (e.g. buffer overflow, SQL injection, cross-site scripting, etc.)
  - Full paths of source file(s) related to the manifestation of the issue
  - The location of the affected source code (tag/branch/commit or direct URL)
  - Any special configuration required to reproduce the issue
  - Step-by-step instructions to reproduce the issue
  - Proof-of-concept or exploit code (if possible)
  - Impact of the issue, including how an attacker might exploit it

  ## Preferred Languages

  We prefer all communications to be in English.

  ## Policy

  We follow the principle of Coordinated Vulnerability Disclosure.

# Code of Conduct
code_of_conduct: |
  # Code of Conduct

  ## Our Pledge

  We as members, contributors, and leaders pledge to make participation in our
  community a harassment-free experience for everyone, regardless of age, body
  size, visible or invisible disability, ethnicity, sex characteristics, gender
  identity and expression, level of experience, education, socio-economic status,
  nationality, personal appearance, race, caste, color, religion, or sexual
  identity and orientation.

  We pledge to act and interact in ways that contribute to an open, welcoming,
  diverse, inclusive, and healthy community.

  ## Our Standards

  Examples of behavior that contributes to a positive environment:

  - Demonstrating empathy and kindness toward other people
  - Being respectful of differing opinions, viewpoints, and experiences
  - Giving and gracefully accepting constructive feedback
  - Accepting responsibility and apologizing to those affected by our mistakes
  - Focusing on what is best not just for us as individuals, but for the overall community

  Examples of unacceptable behavior:

  - The use of sexualized language or imagery, and sexual attention or advances of any kind
  - Trolling, insulting or derogatory comments, and personal or political attacks
  - Public or private harassment
  - Publishing others' private information without their explicit permission
  - Other conduct which could reasonably be considered inappropriate in a professional setting

  ## Enforcement Responsibilities

  Community leaders are responsible for clarifying and enforcing our standards of
  acceptable behavior and will take appropriate and fair corrective action in
  response to any behavior that they deem inappropriate, threatening, offensive,
  or harmful.

  ## Scope

  This Code of Conduct applies within all community spaces, and also applies when
  an individual is officially representing the community in public spaces.

  ## Enforcement

  Instances of abusive, harassing, or otherwise unacceptable behavior may be
  reported to the community leaders responsible for enforcement at {{email}}.

  All complaints will be reviewed and investigated promptly and fairly.

  ## Attribution

  This Code of Conduct is adapted from the [Contributor Covenant][homepage],
  version 2.1, available at
  https://www.contributor-covenant.org/version/2/1/code_of_conduct.html

  [homepage]: https://www.contributor-covenant.org

# Pull Request Template
pull_request_template: |
  ## Description

  <!-- Please include a summary of the changes and which issue is fixed -->

  Fixes # (issue)

  ## Type of change

  <!-- Please delete options that are not relevant -->

  - [ ] Bug fix (non-breaking change which fixes an issue)
  - [ ] New feature (non-breaking change which adds functionality)
  - [ ] Breaking change (fix or feature that would cause existing functionality to not work as expected)
  - [ ] This change requires a documentation update

  ## How Has This Been Tested?

  <!-- Please describe the tests that you ran to verify your changes -->

  - [ ] Test A
  - [ ] Test B

  **Test Configuration**:
  - OS:
  - Node version:
  - Other relevant details:

  ## Checklist:

  - [ ] My code follows the style guidelines of this project
  - [ ] I have performed a self-review of my code
  - [ ] I have commented my code, particularly in hard-to-understand areas
  - [ ] I have made corresponding changes to the documentation
  - [ ] My changes generate no new warnings
  - [ ] I have added tests that prove my fix is effective or that my feature works
  - [ ] New and existing unit tests pass locally with my changes
  - [ ] Any dependent changes have been merged and published

# Issue Templates - Bug Report
issue_bug_report: |
  name: 🐛 Bug Report
  description: Create a report to help us improve
  title: "[BUG] "
  labels: ["bug"]
  assignees: []

  body:
    - type: markdown
      attributes:
        value: |
          Thanks for taking the time to report a bug 🙏  
          Please fill out the information below as clearly as possible.

    - type: textarea
      id: description
      attributes:
        label: Describe the bug
        description: A clear and concise description of what the bug is.
        placeholder: |
          When I run the command..., it crashes with...
      validations:
        required: true

    - type: textarea
      id: reproduce
      attributes:
        label: To Reproduce
        description: Steps to reproduce the behavior
        placeholder: |
          1. Go to '...'
          2. Click on '...'
          3. Scroll down to '...'
          4. See error
      validations:
        required: true

    - type: textarea
      id: expected
      attributes:
        label: Expected behavior
        description: What did you expect to happen?
        placeholder: |
          I expected it to...
      validations:
        required: true

    - type: textarea
      id: screenshots
      attributes:
        label: Screenshots
        description: If applicable, add screenshots to help explain your problem.

    - type: textarea
      id: environment
      attributes:
        label: Environment
        description: Please complete the following information
        placeholder: |
          - OS: Ubuntu 22.04
          - Version: 1.0.0
          - Browser: Chrome 120

    - type: textarea
      id: additional
      attributes:
        label: Additional context
        description: Add any other context about the problem here.


# Issue Templates - Feature Request
issue_feature_request: |
  name: ✨ Feature Request
  description: Suggest an idea for this project
  title: "[FEATURE] "
  labels: ["enhancement"]
  assignees: []

  body:
    - type: markdown
      attributes:
        value: |
          Thanks for suggesting a feature 💡  
          Clear explanations help a lot!

    - type: textarea
      id: problem
      attributes:
        label: Is your feature request related to a problem?
        description: Describe the problem you are facing.
        placeholder: |
          I'm always frustrated when...
      validations:
        required: true

    - type: textarea
      id: solution
      attributes:
        label: Describe the solution you'd like
        description: What would you like to see happen?
      validations:
        required: true

    - type: textarea
      id: alternatives
      attributes:
        label: Describe alternatives you've considered
        description: Any alternative solutions or features you've thought about.

    - type: textarea
      id: additional
      attributes:
        label: Additional context
        description: Add any other context or screenshots here.

    - type: checkboxes
      id: contribution
      attributes:
        label: Would you like to implement this feature?
        options:
          - label: Yes, I'd like to implement this
          - label: No, but I can help with testing
          - label: No, just suggesting

