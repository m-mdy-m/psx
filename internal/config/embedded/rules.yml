    category: devops
    description: Define the local multi-container environment
    severity: info
    patterns:
      - docker-compose.yml
      - docker-compose.yaml
      - compose.yml
      - compose.yaml
    message: "No docker-compose configuration found"
    fix:
      path: docker-compose.yml
      template: docker_compose
      safe: true
    fix_hint: "psx fix --rule docker_compose"
    doc_url: "https://docs.docker.com/compose/"

  kubernetes:
    id: KUBERNETES_MANIFESTS_RECOMMENDED
    category: devops
    description: Ship deployment manifests with the code
    severity: info
    patterns:
      - k8s/
      - kubernetes/
      - manifests/
      - charts/
      - helm/
      - Chart.yaml
    message: "No Kubernetes manifests found"
    fix:
      path: k8s/deployment.yaml
      template: kubernetes
      safe: true
    fix_hint: "psx fix --rule kubernetes"
    doc_url: "https://kubernetes.io/docs/concepts/workloads/"

  nginx:
    id: NGINX_CONFIG_RECOMMENDED
    category: devops
    description: Include reverse proxy configuration when deploying
    severity: info
    patterns:
      - nginx.conf
      - nginx/
      - conf/nginx.conf
      - infra/nginx.conf
    message: "No nginx configuration found"
    fix:
      path: nginx.conf
      template: nginx
      safe: true
    fix_hint: "psx fix --rule nginx"
    doc_url: "https://nginx.org/en/docs/"

  funding:
    id: FUNDING_RECOMMENDED
    category: general
    description: Point sponsors and maintainers at funding options
    severity: info
    patterns:
      - .github/FUNDING.yml
      - .github/FUNDING.yaml
    message: "No FUNDING.yml found"
    fix:
      path: .github/FUNDING.yml
      template: funding
      safe: true
    fix_hint: "psx fix --rule funding"
    doc_url: "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/configuring-your-repository-for-funding"
  # ============================================
  # GitHub Actions workflows
  #
  # Each rule detects one workflow file and can create it from the template
  # library. Only the entry points are rules; the per-platform release workers
  # are reached through release_aggregate.
  # ============================================
  workflow_ci:
    id: WORKFLOW_CI_RECOMMENDED
    category: cicd
    description: Validate every push and pull request
    severity: info
    patterns:
      - .github/workflows/ci.yml
      - .github/workflows/ci.yaml
    message: "No CI workflow found"
    fix:
      path: .github/workflows/ci.yml
      template: ci_go
      safe: true
    fix_hint: "psx fix --rule workflow_ci --answer ci_language=nodejs"
    doc_url: "https://docs.github.com/en/actions"

  workflow_docker:
    id: WORKFLOW_DOCKER_RECOMMENDED
    category: cicd
    description: Build container images and cache the layers
    severity: info
    patterns:
      - .github/workflows/docker.yml
      - .github/workflows/docker.yaml
    message: "No Docker build workflow found"
    fix:
      path: .github/workflows/docker.yml
      template: docker_build
      safe: true
    fix_hint: "psx fix --rule workflow_docker"
    doc_url: "https://docs.github.com/en/actions"

  workflow_release:
    id: WORKFLOW_RELEASE_RECOMMENDED
    category: cicd
    description: Publish artifacts from a version tag
    severity: info
    patterns:
      - .github/workflows/release.yml
      - .github/workflows/release.yaml
    message: "No release workflow found"
    fix:
      path: .github/workflows/release.yml
      template: release_aggregate
      safe: true
    fix_hint: "psx fix --rule workflow_release"
    doc_url: "https://docs.github.com/en/actions"

  workflow_codeql:
    id: WORKFLOW_CODEQL_RECOMMENDED
    category: cicd
    description: Scan for vulnerabilities with CodeQL
    severity: warning
    patterns:
      - .github/workflows/codeql.yml
      - .github/workflows/codeql.yaml
      - .github/codeql-config.yml
    message: "No CodeQL workflow found"
    fix:
      path: .github/workflows/codeql.yml
      template: codeql
      safe: true
    fix_hint: "psx fix --rule workflow_codeql"
    doc_url: "https://docs.github.com/en/code-security/code-scanning"

  workflow_secret_scan:
    id: WORKFLOW_SECRET_SCAN_RECOMMENDED
    category: cicd
    description: Detect leaked credentials before they are merged
    severity: warning
    patterns:
      - .github/workflows/secret-scan.yml
      - .github/workflows/gitleaks.yml
    message: "No secret scanning workflow found"
    fix:
      path: .github/workflows/secret-scan.yml
      template: security_secret_scan
      safe: true
    fix_hint: "psx fix --rule workflow_secret_scan"
    doc_url: "https://docs.github.com/en/code-security/secret-scanning"
