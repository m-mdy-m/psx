      - SUPPORT.md
      - docs/SUPPORT.md
    message: "No SUPPORT.md found"
    fix:
      path: SUPPORT.md
      template: support
      safe: true
    fix_hint: "psx fix --rule support"
    doc_url: ""

  roadmap:
    id: ROADMAP_RECOMMENDED
    category: documentation
    description: Share where the project is heading
    severity: info
    patterns:
      - ROADMAP.md
      - docs/ROADMAP.md
    message: "No ROADMAP.md found"
    fix:
      path: ROADMAP.md
      template: roadmap
      safe: true
    fix_hint: "psx fix --rule roadmap"
    doc_url: ""

  runbook:
    id: RUNBOOK_RECOMMENDED
    category: documentation
    description: Document incident response procedures
    severity: info
    patterns:
      - RUNBOOK.md
      - docs/RUNBOOK.md
      - docs/runbook.md
      - ops/runbook.md
    message: "No operational runbook found"
    fix:
      path: docs/RUNBOOK.md
      template: runbook
      safe: true
    fix_hint: "psx fix --rule runbook"
    doc_url: ""

  pull_request_template:
    id: PULL_REQUEST_TEMPLATE_RECOMMENDED
    category: documentation
    description: Standardise what a pull request contains
    severity: info
    patterns:
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/pull_request_template.md
      - docs/PULL_REQUEST_TEMPLATE.md
    message: "No pull request template found"
    fix:
      path: .github/PULL_REQUEST_TEMPLATE.md
      template: pull_request_template
      safe: true
    fix_hint: "psx fix --rule pull_request_template"
    doc_url: "https://docs.github.com/en/communities"

  issue_templates:
    id: ISSUE_TEMPLATES_RECOMMENDED
    category: documentation
    description: Standardise bug reports and feature requests
    severity: info
    patterns:
      - .github/ISSUE_TEMPLATE/
      - .github/ISSUE_TEMPLATE/bug_report.yml
    message: "No issue templates found"
    fix:
      files:
        .github/ISSUE_TEMPLATE/bug_report.yml: issue_bug_report
        .github/ISSUE_TEMPLATE/feature_request.yml: issue_feature_request
