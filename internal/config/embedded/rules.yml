        .github/ISSUE_TEMPLATE/config.yml: issue_templates_config
      safe: true
    fix_hint: "psx fix --rule issue_templates"
    doc_url: "https://docs.github.com/en/communities"

  # ============================================
  # CI/CD
  # ============================================
  ci_config:
    id: CI_CONFIG_RECOMMENDED
    category: cicd
    description: Run tests automatically on every change
    severity: info
    patterns:
      - .github/workflows/
      - .gitlab-ci.yml
      - .circleci/config.yml
      - .travis.yml
      - Jenkinsfile
      - azure-pipelines.yml
      - .buildkite/
    message: "No CI configuration found"
    fix_hint: "For GitHub Actions run 'psx fix --rule workflow_ci'"
    doc_url: ""

  release_workflow:
    id: RELEASE_WORKFLOW_RECOMMENDED
    category: cicd
    description: Automate releases from tags
    severity: info
    patterns:
      - .github/workflows/release.yml
      - .github/workflows/release.yaml
      - .goreleaser.yml
      - .goreleaser.yaml
    message: "No release automation found"
    fix_hint: "Run 'psx fix --rule workflow_release'"
    doc_url: ""

  dependency_updates:
    id: DEPENDENCY_UPDATES_RECOMMENDED
    category: cicd
    description: Keep dependencies patched automatically
    severity: warning
    patterns:
      - .github/dependabot.yml
      - .github/dependabot.yaml
      - renovate.json
      - renovate.json5
      - .renovaterc
      - .renovaterc.json
    message: "No dependency update automation found"
    fix:
      path: .github/dependabot.yml
      template: dependabot
      safe: true
    fix_hint: "psx fix --rule dependency_updates"
    doc_url: "https://docs.github.com/en/code-security/dependabot"

  # ============================================
  # Quality
  # ============================================
  pre_commit:
    id: PRE_COMMIT_RECOMMENDED
    category: quality
    description: Catch problems before they reach the branch
    severity: info
    patterns:
      - .pre-commit-config.yaml
      - .pre-commit-config.yml
      - .husky/
      - lefthook.yml
    message: "No pre-commit hooks configured"
    fix:
      path: .pre-commit-config.yaml
      template: pre_commit
      safe: true
    fix_hint: "psx fix --rule pre_commit"
    doc_url: "https://pre-commit.com"

  editorconfig:
