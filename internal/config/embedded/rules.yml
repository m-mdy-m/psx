# PSX rule definitions.
#
# Every rule is fully declarative: patterns describe what must exist, and the
# optional fix block describes how to create it. Adding a rule requires no Go
# changes.
#
# patterns accepts either a flat list or a map keyed by project type.
# Lookup order for a map is: <type>, "*", "generic", then the first non-empty
# entry, so an unknown project type still gets sensible coverage.
#
# fix.path must be a literal path, never a glob: a glob says what to detect, not
# what is safe to create. A rule with no fix block is reported but not auto-fixed.

rules:
  # ============================================
  # General
  # ============================================
  readme:
    id: README_REQUIRED
    category: general
    description: Every project should have a README
    severity: error
    patterns:
      - README.md
      - README
      - readme.md
    message: "No README file found in the project root"
    fix:
      path: README.md
      template: readme
      safe: true
    fix_hint: "psx fix --rule readme"
    doc_url: ""

  license:
    id: LICENSE_REQUIRED
    category: general
    description: Projects should declare a clear license
    severity: warning
    patterns:
      - LICENSE
      - LICENSE.md
      - LICENSE.txt
      - COPYING
    additional_checks:
      - file: package.json
        field: license
      - file: Cargo.toml
        field: license
      - file: pyproject.toml
        field: license
    message: "No LICENSE file found"
    fix:
      path: LICENSE
      template: license
      safe: true
    fix_hint: "psx fix --rule license"
    doc_url: "https://choosealicense.com"

  gitignore:
    id: GITIGNORE_REQUIRED
    category: general
    description: Exclude build output and secrets from version control
    severity: warning
    patterns:
      - .gitignore
    message: "No .gitignore file found"
    fix:
      path: .gitignore
      template: gitignore
      safe: true
    fix_hint: "psx fix --rule gitignore"
    doc_url: "https://git-scm.com/docs/gitignore"

  gitattributes:
    id: GITATTRIBUTES_RECOMMENDED
    category: general
    description: Normalise line endings and mark binary files
    severity: info
    patterns:
      - .gitattributes
    message: "No .gitattributes file found"
    fix:
      path: .gitattributes
      template: gitattributes
      safe: true
    fix_hint: "psx fix --rule gitattributes"
    doc_url: "https://git-scm.com/docs/gitattributes"

  changelog:
    id: CHANGELOG_RECOMMENDED
    category: general
    description: Track notable changes between releases
    severity: info
    patterns:
      - CHANGELOG.md
      - CHANGELOG
      - HISTORY.md
    message: "No CHANGELOG file found"
    fix:
      path: CHANGELOG.md
      template: changelog
      safe: true
    fix_hint: "psx fix --rule changelog"
    doc_url: "https://keepachangelog.com"

  env_example:
    id: ENV_EXAMPLE_RECOMMENDED
    category: general
    description: Document required environment variables without leaking secrets
    severity: warning
    patterns:
      - .env.example
      - .env.sample
      - env.example
    message: "No .env.example file found"
    fix:
      path: .env.example
      template: env_example
      safe: true
    fix_hint: "psx fix --rule env_example"
    doc_url: ""

  package_manager:
    id: PACKAGE_MANAGER_REQUIRED
    category: general
    description: The project should declare its dependencies
    severity: error
    patterns:
      nodejs:
        - package.json
      go:
        - go.mod
      rust:
        - Cargo.toml
      python:
        - pyproject.toml
    message: "No dependency manifest found for this project type"
    fix_hint: "Run your package manager's init, e.g. `npm init` or `go mod init`"
    doc_url: ""

  lockfile:
    id: LOCKFILE_RECOMMENDED
    category: general
    description: Commit a lockfile so installs are reproducible
    severity: warning
    patterns:
      nodejs:
        - package-lock.json
        - yarn.lock
        - pnpm-lock.yaml
        - bun.lockb
      go:
        - go.sum
      rust:
        - Cargo.lock
      python:
        - poetry.lock
        - uv.lock
        - requirements.txt
        - Pipfile.lock
    message: "No lockfile found; installs will not be reproducible"
    fix_hint: "Commit the lockfile your package manager generates"
    doc_url: ""

  # ============================================
  # Structure
  # ============================================
  src_folder:
    id: SRC_FOLDER_REQUIRED
    category: structure
    description: Keep source code in a dedicated directory
    severity: warning
    patterns:
      nodejs:
        - src/
        - lib/
      go:
        - cmd/
        - internal/
        - pkg/
      rust:
        - src/
      python:
        - src/
        - "*/"
      generic:
        - src/
    message: "No source directory found"
    fix_hint: "psx fix --rule src_folder"
    doc_url: ""

  tests_folder:
    id: TESTS_FOLDER_REQUIRED
    category: structure
    description: Projects need automated tests
    severity: error
    patterns:
      nodejs:
        - test/
        - tests/
        - __tests__/
        - "**/*.test.js"
        - "**/*.test.ts"
        - "**/*.spec.js"
        - "**/*.spec.ts"
      go:
        - "**/*_test.go"
      rust:
        - tests/
        - src/**/*.rs
      python:
        - tests/
        - test/
      generic:
        - tests/
        - test/
    message: "No tests found"
    fix_hint: "psx fix --rule tests_folder"
    doc_url: ""

  docs_folder:
    id: DOCS_FOLDER_RECOMMENDED
    category: structure
    description: Keep documentation in a dedicated directory
    severity: info
    patterns:
      - docs/
      - documentation/
      - doc/
    message: "No docs/ directory found"
    fix:
      path: docs/README.md
      template: docs_index
      safe: true
    fix_hint: "psx fix --rule docs_folder"
    doc_url: ""

  scripts_folder:
    id: SCRIPTS_FOLDER_RECOMMENDED
    category: structure
    description: Provide helper scripts for common tasks
    severity: info
    patterns:
      - scripts/
      - script/
      - bin/
      - Makefile
      - makefile
      - Taskfile.yml
      - justfile
    message: "No scripts directory or task runner found"
    fix:
      files:
        scripts/setup.sh: script_setup
        scripts/test.sh: script_test
        scripts/build.sh: script_build
        scripts/clean.sh: script_clean
      mode: 493 # 0755
      safe: true
    fix_hint: "psx fix --rule scripts_folder"
    doc_url: ""

  makefile:
    id: MAKEFILE_RECOMMENDED
    category: structure
    description: A Makefile gives contributors a common entry point
    severity: info
    patterns:
      - Makefile
      - makefile
    message: "No Makefile found"
    fix:
      path: Makefile
      template: makefile
      safe: true
    fix_hint: "psx fix --rule makefile"
    doc_url: ""

  # ============================================
  # Documentation
  # ============================================
  adr:
    id: ADR_RECOMMENDED
    category: documentation
    description: Record architecture decisions that are hard to reverse
    severity: info
    patterns:
      - docs/adr/
      - docs/architecture/decisions/
      - adr/
      - doc/adr/
    message: "No ADR directory found"
    fix:
      files:
        docs/adr/README.md: adr_first
        docs/adr/0001-record-architecture-decisions.md: adr_first
        docs/adr/template.md: adr_template
      safe: true
    fix_hint: "psx fix --rule adr"
    doc_url: "https://adr.github.io"

  contributing:
    id: CONTRIBUTING_RECOMMENDED
    category: documentation
    description: Tell contributors how to get started
    severity: info
    patterns:
      - CONTRIBUTING.md
      - .github/CONTRIBUTING.md
      - docs/CONTRIBUTING.md
    message: "No CONTRIBUTING.md found"
    fix:
      path: CONTRIBUTING.md
      template: contributing
      safe: true
    fix_hint: "psx fix --rule contributing"
    doc_url: "https://docs.github.com/en/communities"

  api_docs:
    id: API_DOCS_REQUIRED
    category: documentation
    description: Document the public interface
    severity: warning
    patterns:
      nodejs:
        - docs/api/
        - docs/API.md
        - openapi.yaml
        - openapi.yml
        - openapi.json
      go:
        - docs/api/
        - docs/API.md
        - openapi.yaml
        - openapi.yml
      generic:
        - docs/api/
        - docs/API.md
    message: "No API documentation found"
    fix:
      path: docs/API.md
      template: api_docs
      safe: true
    fix_hint: "psx fix --rule api_docs"
    doc_url: ""

  openapi:
    id: OPENAPI_RECOMMENDED
    category: documentation
    description: Publish a machine-readable API contract
    severity: info
    patterns:
      - openapi.yaml
      - openapi.yml
      - openapi.json
      - swagger.yaml
      - swagger.json
      - api/openapi.yaml
    message: "No OpenAPI specification found"
    fix:
      path: openapi.yaml
      template: openapi
      safe: true
    fix_hint: "psx fix --rule openapi"
    doc_url: "https://spec.openapis.org"

  architecture:
    id: ARCHITECTURE_RECOMMENDED
    category: documentation
    description: Document the system design at a high level
    severity: info
    patterns:
      - ARCHITECTURE.md
      - docs/ARCHITECTURE.md
      - docs/architecture.md
      - docs/architecture/
    message: "No architecture document found"
    fix:
      path: docs/ARCHITECTURE.md
      template: architecture
      safe: true
    fix_hint: "psx fix --rule architecture"
    doc_url: ""

  security:
    id: SECURITY_RECOMMENDED
    category: documentation
    description: Publish how to report vulnerabilities
    severity: info
    patterns:
      - SECURITY.md
      - .github/SECURITY.md
      - docs/SECURITY.md
    message: "No SECURITY.md found"
    fix:
      path: SECURITY.md
      template: security
      safe: true
    fix_hint: "psx fix --rule security"
    doc_url: "https://docs.github.com/en/code-security"

  code_of_conduct:
    id: CODE_OF_CONDUCT_RECOMMENDED
    category: documentation
    description: Set expectations for community behaviour
    severity: info
    patterns:
      - CODE_OF_CONDUCT.md
      - .github/CODE_OF_CONDUCT.md
    message: "No CODE_OF_CONDUCT.md found"
    fix:
      path: CODE_OF_CONDUCT.md
      template: code_of_conduct
      safe: true
    fix_hint: "psx fix --rule code_of_conduct"
    doc_url: "https://docs.github.com/en/communities"

  support:
