    description: Keep formatting consistent across editors
    severity: info
    patterns:
      - .editorconfig
    message: "No .editorconfig file found"
    fix:
      path: .editorconfig
      template: editorconfig
      safe: true
    fix_hint: "psx fix --rule editorconfig"
    doc_url: "https://editorconfig.org"

  code_owners:
    id: CODE_OWNERS_RECOMMENDED
    category: quality
    description: Define ownership so reviews reach the right people
    severity: info
    patterns:
      - CODEOWNERS
      - .github/CODEOWNERS
      - docs/CODEOWNERS
    message: "No CODEOWNERS file found"
    fix:
      path: .github/CODEOWNERS
      template: codeowners
      safe: true
    fix_hint: "psx fix --rule code_owners"
    doc_url: "https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-code-owners"

  node_version:
    id: NODE_VERSION_PINNED
    category: quality
    description: Pin the Node.js version so CI and developer machines agree
    severity: info
    patterns:
      nodejs:
        - .nvmrc
        - .node-version
        - .tool-versions
    message: "Node.js version is not pinned"
    fix:
      path: .nvmrc
      template: node_version
      safe: true
    fix_hint: "psx fix --rule node_version"
    doc_url: ""

  # ============================================
  # DevOps
  # ============================================
  dockerfile:
    id: DOCKERFILE_RECOMMENDED
    category: devops
    description: Package the project as a container image
    severity: info
    patterns:
      - Dockerfile
      - docker/Dockerfile
      - Containerfile
    message: "No Dockerfile found"
    fix:
      path: Dockerfile
      template: dockerfile
      safe: true
    fix_hint: "psx fix --rule dockerfile"
    doc_url: "https://docs.docker.com/reference/dockerfile/"

  dockerignore:
    id: DOCKERIGNORE_RECOMMENDED
    category: devops
    description: Keep the build context small
    severity: info
    patterns:
      - .dockerignore
    message: "No .dockerignore found"
    fix:
      path: .dockerignore
      template: dockerignore
      safe: true
    fix_hint: "psx fix --rule dockerignore"
    doc_url: "https://docs.docker.com/build/concepts/context/#dockerignore-files"

  docker_compose:
